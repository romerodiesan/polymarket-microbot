[project]
name = "polymarket-microbot"
version = "0.1.0"
description = "Order-book microstructure research and paper-trading bot for Polymarket"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "joblib>=1.4,<2",
  "mcp>=1.20,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1.0,<2",
  "scikit-learn>=1.5,<2",
  "websockets>=13,<16",
]

[project.optional-dependencies]
live = ["py-clob-client>=0.34,<1"]
dev = ["pytest>=8,<9", "ruff>=0.7,<1"]
[project.scripts]
microbot = "microbot.main:main"
microbot-train = "microbot.train:main"
microbot-evaluate = "microbot.evaluate:main"
microbot-mcp = "microbot.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microbot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

